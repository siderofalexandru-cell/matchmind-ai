<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MatchMind AI - Analiză fotbal premium">
    <meta name="theme-color" content="#0a0e27">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=200">
    <title>MatchMind AI</title>
</head>
<body>
    <div class="app">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="nav-container">
                <h1 class="logo">⚡ MatchMind AI</h1>
                <div class="nav-links">
                    <button id="homeBtn" class="nav-btn active">🏠</button>
                    <button id="todayBtn" class="nav-btn">📅</button>
                    <button id="searchBtn" class="nav-btn">🔍</button>
                    <button id="historyBtn" class="nav-btn">📊</button>
                    <button id="settingsBtn" class="nav-btn">⚙️</button>
                </div>
            </div>
        </nav>

        <!-- Main Container -->
        <main class="container">
            <!-- Home Page -->
            <section id="homePage" class="page active">
                <h2>Acasă</h2>
                <div class="hero">
                    <div class="hero-icon">⚽</div>
                    <h1>MatchMind AI</h1>
                    <p class="tagline">Analiză fotbal de clasă mondială</p>
                </div>
            </section>

            <!-- Today Page -->
            <section id="todayPage" class="page">
                <h2>Meciurile de azi</h2>
                <div class="content-placeholder">
                    <p>Meciurile de astazi vor fi afisate aici</p>
                </div>
            </section>

            <!-- Search Page -->
            <section id="searchPage" class="page">
                <h2>Căutare</h2>
                <div class="content-placeholder">
                    <p>Căutare meci - va fi implementat</p>
                </div>
            </section>

            <!-- History Page -->
            <section id="historyPage" class="page">
                <h2>Istoric</h2>
                <div class="content-placeholder">
                    <p>Istoric meciuri analizate</p>
                </div>
            </section>

            <!-- Settings Page -->
            <section id="settingsPage" class="page">
                <h2>Setări</h2>
                <div class="settings-container">
                    <div class="setting-group">
                        <label for="apiKeyInput">Cheie API Sports:</label>
                        <input type="password" id="apiKeyInput" placeholder="Introdu cheia API...">
                        <button id="saveApiKeyBtn">Salvează</button>
                        <small id="apiKeyStatus"></small>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js?v=200"></script>
</body>
</html>
