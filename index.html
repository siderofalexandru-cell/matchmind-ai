<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MatchMind AI - Analiză fotbal premium cu AI">
    <meta name="theme-color" content="#0a0e27">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MatchMind AI">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=200">
    <title>MatchMind AI</title>
</head>
<body>
    <div class="app">
        <!-- Navigation Bar -->
        <nav class="navbar">
            <div class="nav-container">
                <h1 class="logo">⚡ MatchMind AI</h1>
                <div class="nav-links">
                    <button id="homeBtn" class="nav-btn active" title="Acasă">🏠</button>
                    <button id="todayBtn" class="nav-btn" title="Meciurile de azi">📅</button>
                    <button id="searchBtn" class="nav-btn" title="Căutare">🔍</button>
                    <button id="historyBtn" class="nav-btn" title="Istoric">📊</button>
                    <button id="settingsBtn" class="nav-btn" title="Setări">⚙️</button>
                </div>
            </div>
        </nav>

        <!-- Main Container -->
        <main class="container">
            <!-- HOME PAGE -->
            <section id="homePage" class="page active">
                <div class="page-title">Acasă</div>
                <div class="hero">
                    <div class="hero-icon">⚽</div>
                    <h1>MatchMind AI</h1>
                    <p class="tagline">Analiză fotbal de clasă mondială</p>
                </div>
            </section>

            <!-- TODAY PAGE -->
            <section id="todayPage" class="page">
                <div class="page-title">Meciurile de azi</div>
                <div class="content-placeholder">
                    <p>Meciurile de astazi vor fi afisate aici</p>
                </div>
            </section>

            <!-- SEARCH PAGE -->
            <section id="searchPage" class="page">
                <div class="page-title">Caută</div>
                <div class="content-placeholder">
                    <p>Căutare meci - va fi implementat</p>
                </div>
            </section>

            <!-- HISTORY PAGE -->
            <section id="historyPage" class="page">
                <div class="page-title">Istoric</div>
                <div class="content-placeholder">
                    <p>Istoric meciuri analizate</p>
                </div>
            </section>

            <!-- SETTINGS PAGE -->
            <section id="settingsPage" class="page">
                <div class="page-title">Setări</div>
                <div class="content-placeholder">
                    <p>Setări aplicatie</p>
                </div>
            </section>
        </main>
    </div>

    <div id="toast" class="toast"></div>

    <!-- Load app script with cache busting -->
    <script src="app.js?v=200"></script>
</body>
</html>
